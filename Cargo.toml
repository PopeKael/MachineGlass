[package]
name = "machineglass"
version = "0.1.0"
edition = "2024"
description = "Native Windows system observability console"
license = "LicenseRef-Proprietary"
default-run = "MachineGlass"

[[bin]]
name = "MachineGlass"
path = "src/main.rs"

[[bin]]
name = "collector-probe"
path = "src/bin/collector_probe.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
