[package]
name = "machineglass"
version = "0.1.0"
edition = "2024"
description = "Native Windows system observability console"
license = "MIT"
default-run = "MachineGlass"

[[bin]]
name = "MachineGlass"
path = "src/main.rs"

[[bin]]
name = "collector-probe"
path = "src/bin/collector_probe.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Performance"] }
raw-window-handle = "=0.6.2"
tray-icon = { version = "=0.26.0", default-features = false }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi"] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
